body{min-height:100svh;display:grid;place-items:center;overflow-x:hidden;padding:28px 18px;background:radial-gradient(ellipse at 78% 16%,rgba(230,0,66,.24),transparent 36%),radial-gradient(ellipse at 12% 88%,rgba(128,0,40,.43),transparent 38%),linear-gradient(135deg,#170009 0%,#350017 56%,#21000d 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}

.wrap{width:min(100%,710px);animation:enter .8s cubic-bezier(.2,.75,.25,1) both}.card{position:relative;overflow:hidden;padding:clamp(30px,7vw,62px);border:1px solid rgba(255,255,255,.13);border-radius:28px;background:linear-gradient(145deg,rgba(74,9,34,.84),rgba(33,3,17,.92));box-shadow:0 28px 90px rgba(9,0,5,.52),inset 0 1px rgba(255,255,255,.08);text-align:center;backdrop-filter:blur(16px)}.card:before{content:"";position:absolute;inset:0 18% auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,88,131,.8),transparent)}

h1{max-width:590px;margin:0 auto;color:#fff;font-size:clamp(34px,7vw,58px);line-height:1.04;letter-spacing:-.052em;font-weight:760;animation:soft-rise .8s .23s both}.accent{color:#ff5b88}.copy{max-width:500px;margin:22px auto 0;color:var(--muted);font-size:clamp(15px,2.4vw,18px);line-height:1.75;animation:soft-rise .8s .31s both}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:58px;margin-top:31px;padding:0 27px;border:1px solid rgba(255,255,255,.28);border-radius:14px;background:linear-gradient(135deg,#f10a50,#c90042);box-shadow:0 12px 30px rgba(220,0,64,.3),inset 0 1px rgba(255,255,255,.27);color:#fff;text-decoration:none;font-size:15px;font-weight:760;transition:transform .22s ease,box-shadow .22s ease,filter .22s ease;animation:soft-rise .8s .39s both}.cta:hover{transform:translateY(-3px);filter:brightness(1.08);box-shadow:0 17px 36px rgba(220,0,64,.4),inset 0 1px rgba(255,255,255,.28)}.cta:focus-visible{outline:3px solid #fff;outline-offset:4px}.cta svg{width:21px;height:21px;flex:none}.phone{margin:14px 0 0;color:#d8b5c0;font-size:13px;animation:soft-rise .8s .45s both}.footer{margin:22px 0 0;color:rgba(255,239,244,.56);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
@keyframes enter{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes soft-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 14px #ff3d77}50%{opacity:.55;box-shadow:0 0 5px #ff3d77}}@keyframes orbit{to{transform:rotate(360deg)}}
@media(max-width:520px){body{padding:18px 14px}.card{padding:32px 22px;border-radius:22px}.logo-shell{padding:8px 14px}.eyebrow{margin-top:28px;font-size:10px;letter-spacing:.13em}.cta{width:100%;padding:0 16px}.footer{font-size:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
